# S117: Local variable naming - $EZSQL_ERROR is WordPress convention
sonar.issue.ignore.multicriteria.e3.ruleKey=php:S117
sonar.issue.ignore.multicriteria.e3.resourceKey=**/*

# S115: Constant naming - 'object' is WordPress API constant
sonar.issue.ignore.multicriteria.e4.ruleKey=php:S115
sonar.issue.ignore.multicriteria.e4.resourceKey=**/*

# S1068: Unused field $use_mysqli - used by eval replacement in core.php
