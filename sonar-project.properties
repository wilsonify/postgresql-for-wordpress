# Suppress WON'T FIX issues:
# - wpsqli_* naming convention (S100): deliberate MySQLi API compatibility
# - wpdb field naming (S116): upstream WordPress conventions
# - Class naming (S101) for WP_Object_Cache, wpdb: upstream WordPress
# - $use_mysqli field unused (S1068): IS used via eval replacement in core.php
# - Class size (S1448): wpdb/WP_Object_Cache are upstream WordPress files
# - Function length (S138): prepare() is upstream WordPress
# - Local var naming $EZSQL_ERROR (S117): upstream WordPress diagnostic tool convention
# - Constant name "object" (S115): upstream WordPress API constant
# - Function naming in wp-includes/ (S100): upstream WordPress API

sonar.issue.ignore.multicriteria=e1,e2,e3,e4,e5,e6,e7,e8,e9,e10

# S100: Function naming convention - wpsqli_* follows MySQLi API pattern
