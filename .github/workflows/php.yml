name: PG4WP CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]
  workflow_dispatch:

permissions:
  contents: read

env:
  PG4WP_TEST_DSN: host=localhost port=5432 dbname=pg4wp_test user=pg4wp password=pg4wp

jobs:
  lint:
    name: Syntax PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [8.1, 8.2, 8.3, 8.4]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: ${{ matrix.php }}
      - name: PHP Lint
        run: bash .github/workflows/scripts/ci-lint.sh

  sql-rewrite:
    name: Rewrite PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [8.1, 8.2, 8.3, 8.4]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: ${{ matrix.php }}
      - name: Run SQL Rewrite Tests
        run: php tests/tools/run-tests.php tests/

  pgsql-integration:
    name: PG ${{ matrix.pgsql }} / PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [8.1, 8.3]
        pgsql: [14, 15, 16, 17]
    services:
      postgres:
        image: postgres:${{ matrix.pgsql }}
        env:
          POSTGRES_PASSWORD: pg4wp
          POSTGRES_DB: pg4wp_test
          POSTGRES_USER: pg4wp
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: pgsql
      - name: Wait for PostgreSQL
        run: bash .github/workflows/scripts/wait-for-pg.sh
      - name: Connection Test
        run: php .github/workflows/scripts/test-pg-connection.php
      - name: wpsqli Function Mapping Test
        run: php .github/workflows/scripts/test-wpsqli-mapping.php

  wordpress-install:
    name: WP ${{ matrix.wp }} / PHP ${{ matrix.php }} / PG16
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [8.1, 8.2, 8.3]
        wp: [6.4, 6.5, 6.6, latest]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: pg4wp
          POSTGRES_DB: wordpress
          POSTGRES_USER: pg4wp
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: pgsql
          tools: wp-cli
      - name: Wait for PostgreSQL
        run: bash .github/workflows/scripts/wait-for-pg.sh
      - name: Install WordPress ${{ matrix.wp }} (allow failure)
        continue-on-error: true
        run: bash .github/workflows/scripts/install-wordpress.sh ${{ matrix.wp }}

  woocommerce-install:
    name: WC ${{ matrix.wc }} + WP ${{ matrix.wp }} / PG16 / PHP 8.2
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        wp: [6.5, 6.6, latest]
        wc: [8.9, 9.3, latest]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: pg4wp
          POSTGRES_DB: wordpress
          POSTGRES_USER: pg4wp
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: 8.2
          extensions: pgsql
          tools: wp-cli
      - name: Wait for PostgreSQL
        run: bash .github/workflows/scripts/wait-for-pg.sh
      - name: Install WordPress ${{ matrix.wp }} (allow failure)
        continue-on-error: true
        run: bash .github/workflows/scripts/install-wordpress.sh ${{ matrix.wp }}
      - name: Install WooCommerce ${{ matrix.wc }} (if WP installed)
        continue-on-error: true
        run: bash .github/workflows/scripts/install-woocommerce.sh ${{ matrix.wc }}
