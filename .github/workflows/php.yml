name: PHP Composer

on:
  workflow_dispatch:
  push:
    branches: [ "v2", "v3" ]
  pull_request:
    branches: [ "v2", "v3" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.3.36'
        coverage: none

    - name: Run Tests
      run: ./tests/tools/phpunit.phar tests/